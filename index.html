:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color-scheme:dark;background:#0b111b;color:#ecf5fc;--a:#65e3be;--bg:#0b111b;--panel:#172334;--line:#314255;--muted:#9db3c5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:var(--a);color:#06271d;font-weight:750}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#2a3e50;color:#e9f2f9}.danger{background:#61313c;color:#ffdae1}input,textarea,select{background:#0e1927;color:#e9f4fc;border:1px solid #466076;border-radius:9px;padding:11px;max-width:100%;width:100%;min-height:43px}textarea{min-height:73px}label{font-size:12px;color:#adbfce;display:block;margin:12px 0 5px}h1,h2,h3{letter-spacing:-.5px}h1{font-size:30px;margin:0}h2{font-size:21px;margin:0 0 13px}h3{font-size:15px;margin:0 0 9px}p{color:#adc0d0;line-height:1.5}.small,small{font-size:12px;color:#9eb3c5}.brand{font-size:23px;font-weight:850}.brand b{color:var(--a)}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin:12px 0}.shell{max-width:1100px;margin:auto;padding:24px 16px 98px}.auth{max-width:460px;margin:9vh auto}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#101c2a;border:1px solid #33485c;border-radius:13px;padding:15px}.stat strong{display:block;font-size:26px;color:var(--a);margin:5px 0}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:0;background:#0b111bf0;z-index:4}.tabs button{white-space:nowrap;background:#223447;color:#c6d4df}.tabs button.active{background:var(--a);color:#08251c}.pill{font-size:11px;background:#24453f;color:#a1f7d9;padding:6px 9px;border-radius:16px}.notice{padding:12px;border-left:3px solid #e9bf78;background:#2d2c2b;border-radius:7px;font-size:12px;color:#f2dfbe}.hidden{display:none!important}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.exercise{padding:15px;border:1px solid #344a61;background:#111f2e;border-radius:13px;margin:11px 0}.exercise-head{display:flex;justify-content:space-between;align-items:start;gap:9px}.set{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr)) 76px;gap:7px;align-items:end;margin:9px 0}.set span{text-align:center;padding-bottom:11px;color:var(--a)}.set label{margin:0}.set button{padding:11px 4px;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #35485b;padding:12px;text-align:left}th{color:var(--muted);font-size:12px}.status{min-height:21px;font-size:13px;color:var(--a);margin:8px 0}.switch{display:flex;gap:10px}.switch button{flex:1}.footer{padding:10px 0;font-size:11px;color:#91a6b8}.clock{font-size:32px;color:var(--a);font-weight:800}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:12px}.sr{position:absolute;left:-9999px}.banner{padding:9px 16px;text-align:center;font-size:12px;background:#523d23;color:#ffe2b7}@media(max-width:500px){.shell{padding:15px 10px 90px}.panel{padding:14px}.set{grid-template-columns:24px repeat(3,minmax(0,1fr)) 53px;gap:4px}.set button{font-size:10px;padding:10px 2px}.set input{padding:7px 3px;min-width:0}.set label{font-size:10px}}

</style></head><body><div class="banner">DEMO PÚBLICA · Solo datos ficticios. No uses contraseñas habituales ni datos personales. Sin autenticación ni permisos de servidor.</div><main id="root" class="shell"></main>
<button id="restLauncher" type="button" aria-label="Abrir cronómetro de descanso" title="Abrir cronómetro">⏱ <span id="restBadge">0 s</span></button>
<section id="restBubble" class="rest-bubble" hidden aria-label="Cronómetro flotante de descanso">

 <div class="rest-presets" aria-label="Ajustar descanso"><button type="button" data-seconds="60">60 s</button><button type="button" data-seconds="90">90 s</button><button type="button" data-seconds="120">120 s</button><button type="button" data-seconds="180">180 s</button></div>
</section>
<script>
'use strict';
const STORE='fitos_demo_v06_public';
async function demoHash(email,password){const data=new TextEncoder().encode('FitOS-demo-only:'+email+':'+password);const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
const DAYS=[{name:'Pierna A · Cuádriceps',ex:[['Hack squat',3,'8–12',180,2],['Prensa 45°',3,'10–15',150,2],['Extensión de cuádriceps',3,'12–15',90,1],['Pantorrilla sentado',4,'10–15',75,2]]},{name:'Push A · Pecho y hombros',ex:[['Press inclinado máquina',3,'6–10',150,2],['Press pecho máquina',3,'8–12',120,2],['Elevación lateral',4,'12–20',75,2]]},{name:'Pull A · Espalda',ex:[['Jalón neutro',3,'8–12',120,2],['Remo pecho apoyado',3,'8–12',120,2],['Curl bíceps',3,'10–15',90,2]]},{name:'Pierna B · Femoral y glúteo',ex:[['Curl femoral sentado',4,'8–12',120,2],['Hip thrust máquina',3,'8–12',150,2],['Abducción máquina',3,'12–20',75,2]]},{name:'Torso B · Hombros',ex:[['Press hombro máquina',3,'8–12',120,2],['Elevación lateral',3,'12–20',75,2],['Curl predicador',3,'10–15',90,2]]},{name:'Pierna C · Completa',ex:[['Smith a caja',3,'8–12',150,2],['Prensa unilateral',2,'10–12',120,2],['Curl femoral sentado',3,'10–15',90,2]]}];
const $=s=>document.querySelector(s), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const month=()=>now().slice(0,7);
const uid=()=>crypto.randomUUID();
const base=()=>({plans:[],quickWorkouts:{},version:4,branches:[{id:'b1',name:'Sucursal Norte'},{id:'b2',name:'Sucursal Centro'},{id:'b3',name:'Sucursal Sur'}],users:[],memberships:[],sets:[],measures:[],session:null,fee:20,closures:[],completedWorkouts:[]});
let db;try{db=JSON.parse(localStorage.getItem(STORE))||base();if(db.version!==4||!Array.isArray(db.users))throw Error('version')}catch{db=base()};db.plans=Array.isArray(db.plans)?db.plans:[];db.quickWorkouts=db.quickWorkouts&&typeof db.quickWorkouts==='object'?db.quickWorkouts:{};db.completedWorkouts=Array.isArray(db.completedWorkouts)?db.completedWorkouts:[];let page='home',selectedDay=0,timerStart=0,timerSeconds=0,timerInterval=null;
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch{return false}}
function atomicChange(change){const prior=structuredClone(db);try{change();if(!persist())throw Error('storage');return true}catch{db=prior;return false}}
function csvCell(v){const s=String(v??'');const guarded=/^[\s]*[=+@-]/.test(s)?'\''+s:s;return '"'+guarded.replace(/"/g,'""')+'"'}
function user(){return db.users.find(u=>u.id===db.session)||null}function membership(u){return db.memberships.find(m=>m.userId===u.id)}function valid(m,at=now()){return !!m&&m.status==='active'&&m.start<=at&&m.end>=at}
function flash(m){const x=$('#status');if(x)x.textContent=m}function layout(content){$('#root').innerHTML=content}const headline=()=>`<div class="row"><div class="brand">Fit<b>OS</b></div><span class="pill">${escapeHTML(user()?.role==='owner'?'Administrador general':'Deportista')}</span></div>`;
function login(){layout(`<div class="auth"><div class="brand">Fit<b>OS</b></div><h1>Bienvenido</h1><p>Prueba las funciones como deportista o dueño del gimnasio.</p><div class="panel"><div class="switch"><button id="loginTab">Iniciar sesión</button><button class="secondary" id="signupTab">Crear cuenta</button></div><form id="access"><label>Correo electrónico</label><input name="email" type="email" required autocomplete="username"><label>Contraseña</label><input name="password" type="password" minlength="8" required autocomplete="current-password"><div id="newFields" class="hidden"><label>Nombre</label><input name="name" maxlength="100"><label>Sucursal</label><select name="branch">${db.branches.map(b=>`<option value="${b.id}">${escapeHTML(b.name)}</option>`).join('')}</select><label>Tipo de cuenta de prueba</label><select name="role"><option value="athlete">Deportista</option><option value="owner">Dueño del gimnasio</option></select><div class="notice">En producción, el rol de dueño únicamente podrá asignarlo un administrador autorizado. Aquí está habilitado para evaluar ambos recorridos.</div></div><button id="accessSubmit" style="width:100%">Entrar</button><p class="status" id="status" role="status"></p></form></div><p class="small">Prueba pública local: utiliza correo inventado y contraseña exclusiva. No hay sincronización ni autenticación segura.</p></div>`);let signup=false;const toggle=x=>{signup=x;$('#newFields').classList.toggle('hidden',!signup);$('#accessSubmit').textContent=signup?'Crear cuenta':'Entrar';$('#loginTab').className=signup?'secondary':'';$('#signupTab').className=signup?'':'secondary';$('#access').elements.name.required=signup};$('#signupTab').onclick=()=>toggle(true);$('#loginTab').onclick=()=>toggle(false);$('#access').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),password=f.get('password');if(signup){if(db.users.some(u=>u.email===email))return flash('Este correo ya existe.');if(password.length<8)return flash('La contraseña debe tener 8 caracteres o más.');const u={id:uid(),email,name:f.get('name').trim(),role:f.get('role'),branch:f.get('branch'),passwordHash:await demoHash(email,password),created:now(),goal:'',height:'',weight:'',waist:''};if(!u.name)return flash('Escribe tu nombre.');db.users.push(u);db.memberships.push({id:uid(),userId:u.id,branch:u.branch,start:now(),end:`${Number(now().slice(0,4))+1}-${now().slice(5)}`,status:'active'});db.session=u.id;if(!persist()){db.users.pop();db.memberships.pop();db.session=null;return flash('No se pudieron guardar los datos en este navegador.')}page='home';return render()}const passwordHash=await demoHash(email,password);const u=db.users.find(u=>u.email===email&&u.passwordHash===passwordHash);if(!u)return flash('Credenciales incorrectas.');const previousSession=db.session;db.session=u.id;if(!persist()){db.session=previousSession;return flash('No se pudo guardar la sesión.');}page='home';render()};}
function nav(){let u=user();let tabs=u.role==='owner'?[['home','Resumen'],['members','Miembros'],['billing','Facturación'],['profile','Mi perfil']]:[['home','Inicio'],['training','Entrenar'],['generator','Generar rutina'],['measures','Mediciones'],['history','Historial'],['profile','Mi perfil']];return `<div class="tabs">${tabs.map(([k,n])=>`<button data-page="${k}" class="${page===k?'active':''}">${n}</button>`).join('')}</div>`}
function render(){const u=user();if(!u)return login();let content='';if(u.role==='owner'){if(!['home','members','billing','profile'].includes(page))page='home';content=({home:ownerHome,members:members,billing:billing,profile:profile})[page]()}else{if(!['home','training','generator','measures','history','profile'].includes(page))page='home';content=({home:athleteHome,training:training,generator:generator,measures:measures,history:history,profile:profile})[page]()}layout(`${headline()}${nav()}<p class="status" id="status" role="status"></p>${content}<div class="footer">FitOS QA v1.0 · Prueba local, no producción · <button class="secondary" id="logout">Cerrar sesión</button></div>`);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#logout').onclick=()=>{if(!atomicChange(()=>{db.session=null}))return flash('No se pudo cerrar sesión');login()};wire()}

const FINISH_MESSAGES=['Cada paso cuenta. Hoy cumpliste contigo.','La constancia se construye con pequeños logros.','Tu progreso no necesita ser perfecto para ser real.','Terminaste una sesión. Reconoce tu esfuerzo y recupera energía.','Entrenar también es darte un momento de atención y cuidado.','Hoy sumaste un día a tu bienestar. Sigue a tu ritmo.','Tu fuerza crece cuando respetas el proceso.'];
function dayOrdinal(day){const [y,m,d]=day.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)}
function streakFor(userId,reference=now()){const days=[...new Set(db.completedWorkouts.filter(x=>x.userId===userId).map(x=>x.date))].sort().reverse();if(!days.length)return 0;let last=dayOrdinal(days[0]),today=dayOrdinal(reference);if(last>today||today-last>1)return 0;let count=0;for(const date of days){const n=dayOrdinal(date);if(n===last){count++;last--}else if(n<last)break}return count}
function completionProgress(u,w,date=now()){const required=w.session.ex.reduce((a,ex)=>a+ex.sets,0);const saved=w.session.ex.reduce((a,ex)=>a+Array.from({length:ex.sets},(_,j)=>db.sets.some(row=>row.userId===u.id&&row.date===date&&row.workoutKey===w.key&&row.exerciseId===ex.id&&row.number===j+1)).filter(Boolean).length,0);const finished=db.completedWorkouts.some(row=>row.userId===u.id&&row.date===date&&row.workoutKey===w.key);return {required,saved,finished}}
function movementCue(intensity){const tempo=intensity==='light'?'2-0-2-0':intensity==='high'?'3-1-1-1':'3-0-1-0';const [ecc,hold,con,top]=tempo.split('-');return 'Tempo '+tempo+' (segundos): '+ecc+' s al bajar (fase excéntrica o negativa); '+(hold==='0'?'sin pausa abajo':hold+' s de pausa isométrica abajo')+'; '+con+' s al subir (fase concéntrica); '+(top==='0'?'sin pausa arriba':top+' s de pausa arriba')+'. '+(intensity==='high'?'Las pausas y los negativos deben ser controlados, sin dolor ni sobrecarga innecesaria.':'Mantén el movimiento controlado, sin necesidad de técnicas avanzadas.')}

function routineFromCriteria(c,dayIndex=0){
 const strength=c.objective==='strength',endurance=c.objective==='endurance';
 const rest=strength?120:c.intensity==='high'?90:c.intensity==='moderate'?75:60;
 const sets=c.wholeBody?(c.minutes<=30?1:c.intensity==='high'&&c.minutes>=75?3:2):(c.minutes<=20 && c.muscles.length>=3)?1:c.intensity==='high'?3:2;
 const reps=c.wholeBody&&c.minutes<=30?'8–10':strength?'6–10':endurance?'12–20':['hypertrophy','recomposition'].includes(c.objective)?'8–12':'10–15';
 const rir=c.intensity==='light'?4:c.intensity==='moderate'?3:2;
 const warmup=Math.min(7,Math.max(4,Math.round(c.minutes*.12)));let remaining=c.minutes-warmup;
 const muscles=c.wholeBody?[...c.muscles]:c.duration==='today'||c.frequency===1?[...c.muscles]:c.frequency<=c.muscles.length?c.muscles.filter((_,i)=>i%c.frequency===dayIndex):[c.muscles[dayIndex%c.muscles.length]];const available=[];
 for(let pass=0;pass<(c.wholeBody?1:4);pass++){let added=false;for(const m of muscles){
  const items=EXERCISE_BANK[m],ex=items[(pass+dayIndex)%items.length];
  if(available.some(x=>x.id===m+':'+ex[0]))continue;
  const topReps=Number(reps.split('–').at(-1));const repetitionSeconds=c.intensity==='high'?6:4;const cost=Math.ceil((sets*topReps*repetitionSeconds+(sets-1)*rest+(c.wholeBody?25:50))/60);
  if(cost>remaining)continue;
  remaining-=cost;added=true;
  available.push({id:m+':'+ex[0],muscle:m,name:ex[0],sets,reps,rir,rest,tech:ex[1],equipment:ex[2],minutes:cost});

function readCriteria(form){const f=new FormData(form),wholeBody=f.get('wholeBody')==='yes',ids=wholeBody?MUSCLES.map((_,i)=>i):f.getAll('muscle').map(Number);
 if(ids.length<1||(!wholeBody&&ids.length>3)||ids.some(x=>!Number.isInteger(x)||x<0||x>=MUSCLES.length)||new Set(ids).size!==ids.length)throw Error('Elige entre uno y tres grupos musculares.');
 const minutes=Number(f.get('minutes'));const duration=String(f.get('duration'));const frequency=duration==='today'?1:Number(f.get('frequency'));if(![20,30,40,45,60,75,90].includes(minutes)||!Number.isInteger(frequency)||frequency<1||frequency>6)throw Error('Revisa los minutos o cuántas veces entrenarás por semana.');

 if(!['light','moderate','high'].includes(intensity)||!['general','tone','hypertrophy','fatloss','recomposition','strength','endurance'].includes(objective)||!['today','week','fortnight','month'].includes(duration))throw Error('Revisa la configuración de tu rutina.');

function futureDay(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function routinePreview(c,sessions){

 <p>${isToday?'Una rutina para hoy':`Plan de ${c.days} días con ${sessions.length} entrenamiento(s) distintos por semana`}. Elige cuándo hacer cada sesión y deja tiempo para recuperarte.</p>

const oldWire=wire;
wire=function(){oldWire();const form=$('#generateForm');if(form){const explain=()=>{const all=form.elements.wholeBody.checked;form.querySelectorAll('input[name="muscle"]').forEach(x=>{x.disabled=all;if(all)x.checked=false});const days=form.elements.duration.value;$('#planFrequency').classList.toggle('hidden',days==='today');const chosen=all?[...MUSCLES]:[...form.querySelectorAll('input[name="muscle"]:checked')].map(x=>MUSCLES[Number(x.value)]);const el=$('#muscleExplain');if(!chosen.length){el.textContent='Elige al menos una zona para continuar.';return}if(!all&&chosen.length>3){el.textContent='Puedes elegir un máximo de tres zonas.';return}if(all){el.textContent='Entrenarás las siete zonas principales en cada sesión, ajustando las series al tiempo disponible.';return}if(days==='today'){el.textContent='Hoy combinarás ejercicios para: '+chosen.join(', ')+'.';return}const n=Number(form.elements.frequency.value);el.textContent=n+' entrenamiento'+(n===1?'':'s')+' en total por semana. '+(n===1?'Combinarás las zonas seleccionadas en una sesión.':n<=chosen.length?'Las zonas se repartirán entre esos entrenamientos.':'FitOS alternará estas zonas entre los entrenamientos; algunas se repetirán.')+' No son '+n+' sesiones por músculo.';};form.elements.duration.onchange=explain;form.elements.frequency.onchange=explain;form.elements.wholeBody.onchange=explain;form.querySelectorAll('input[name="muscle"]').forEach(x=>x.onchange=()=>{const checked=[...form.querySelectorAll('input[name="muscle"]:checked')];if(checked.length>3){x.checked=false;flash('Puedes seleccionar hasta 3 zonas.')}explain()});explain();form.onsubmit=e=>{e.preventDefault();try{const c=readCriteria(form),sessions=Array.from({length:c.duration==='today'?1:c.frequency},(_,i)=>routineFromCriteria(c,i));$('#generatedPreview').innerHTML=routinePreview(c,sessions);$('#acceptRoutine').onclick=()=>{if(!atomicChange(()=>{if(c.duration==='today'){db.quickWorkouts[user().id]={id:uid(),date:now(),session:sessions[0]};}else{const plan={id:uid(),userId:user().id,title:c.muscles.join(' + '),start:now(),end:futureDay(c.days-1),sessions,criteria:c,created:now()};db.plans.push(plan);user().activePlanId=plan.id;delete db.quickWorkouts[user().id];}}))return flash('No se pudo guardar la rutina.');selectedDay=0;page='training';render();};$('#cancelRoutine').onclick=()=>$('#generatedPreview').innerHTML='';}catch(err){flash(err.message)}};}
 if($('#openSaved'))$('#openSaved').onclick=()=>{if(!atomicChange(()=>{delete db.quickWorkouts[user().id]}))return flash('No se pudo cambiar de rutina');selectedDay=0;page='training';render()};if($('#openQuick'))$('#openQuick').onclick=()=>{page='training';render()};if($('#removeSaved'))$('#removeSaved').onclick=()=>{if(!atomicChange(()=>{user().activePlanId=null}))return flash('No se guardó el cambio');render()};
 if($('#showLegacy'))$('#showLegacy').onclick=()=>{$('#legacySection').innerHTML=DAYS.map((d,i)=>`<p class="small"><b>Día ${i+1}: ${escapeHTML(d.name)}</b> · ${d.ex.map(e=>escapeHTML(e[0])).join(', ')}</p>`).join('')};
 const choose=$('#workoutChoice');if(choose)choose.onchange=e=>{selectedDay=Number(e.target.value);render()};
 document.querySelectorAll('[data-save-generated]').forEach(b=>b.onclick=()=>{const row=b.closest('.set'),work=ownWorkout();if(!work)return flash('No hay rutina activa.');const kgInput=row.querySelector('[data-kg]'),repInput=row.querySelector('[data-reps]'),rirInput=row.querySelector('[data-rir]');const kg=Number(kgInput.value),reps=Number(repInput.value),rir=Number(rirInput.value);if(!kgInput.value||!repInput.value||!rirInput.value||!Number.isFinite(kg)||kg<0||kg>2500||!Number.isInteger(reps)||reps<1||reps>200||!Number.isInteger(rir)||rir<0||rir>10)return flash('Revisa peso, repeticiones y RIR.');
 const key={userId:user().id,date:now(),workoutKey:work.key,exerciseId:row.dataset.exercise,number:Number(row.dataset.set)};
 if(!atomicChange(()=>{const existing=db.sets.find(s=>Object.keys(key).every(k=>s[k]===key[k]));if(existing)Object.assign(existing,{kg,reps,rir,exerciseName:row.dataset.name});else db.sets.push({...key,kg,reps,rir,exerciseName:row.dataset.name})}))return flash('No se pudo guardar esta serie.');b.textContent='Editar';const w=ownWorkout(),finish=$('#finishWorkout'),progress=$('#finishProgress');if(w){const p=completionProgress(user(),w);if(finish)finish.disabled=p.finished||p.saved!==p.required;if(progress)progress.textContent=p.saved+' de '+p.required+' series registradas.'}flash('Serie guardada.');});
 const finish=$('#finishWorkout');if(finish)finish.onclick=()=>{const u=user(),w=ownWorkout(),p=w?completionProgress(u,w):null;if(!p||p.finished||p.saved!==p.required)return flash('Primero guarda todas las series de esta sesión.');if(!atomicChange(()=>{if(!db.completedWorkouts.some(x=>x.userId===u.id&&x.date===now()&&x.workoutKey===w.key))db.completedWorkouts.push({id:uid(),userId:u.id,date:now(),workoutKey:w.key,title:w.session.title,completedAt:new Date().toISOString()})}))return flash('No se pudo guardar el entrenamiento finalizado.');finish.disabled=true;finish.textContent='Sesión finalizada';completionModal(FINISH_MESSAGES[dayOrdinal(now())%FINISH_MESSAGES.length],streakFor(u.id))};
 document.querySelectorAll('[data-rest]').forEach(button=>button.onclick=()=>restStart(Number(button.dataset.rest)));
};
function training(){const u=user(),w=ownWorkout();if(!w)return `<h1>Entrenamiento</h1><div class="panel"><h2>Aún no tienes una rutina asignada</h2><p>Genera tu primera rutina según las zonas del cuerpo, la exigencia y el tiempo que tengas disponible.</p><button data-go="generator">Generar rutina</button></div><div class="panel"><h2>Programa de ejemplo</h2><p class="small">Los seis días de Performance OS se mantienen como referencia, pero no se aplican automáticamente a principiantes.</p><button id="showLegacy">Ver referencia de entrenamiento</button><div id="legacySection"></div></div>`;
 const d=w.session;return `<h1>Entrenar</h1><div class="panel"><div class="row"><div><h2>${escapeHTML(w.plan?'Mi rutina guardada':'Entrenamiento de hoy')}</h2><p class="small">${escapeHTML(d.title)} · ${d.estimatedMinutes} min estimados · ${w.plan?`vigencia hasta ${w.plan.end}`:'sesión única'}</p></div><button class="secondary" data-go="generator">Generar otra rutina</button></div>${w.plan?`<label>Sesión de mi plan</label><select id="workoutChoice">${w.plan.sessions.map((s,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>Día ${i+1}: ${escapeHTML(s.title)}</option>`).join('')}</select>`:''}<p class="helper">Utiliza el cronómetro flotante, disponible durante toda la sesión.</p></div>${d.ex.map((ex,i)=>`<div class="exercise"><div class="exercise-head"><h3>${escapeHTML(ex.name)}</h3><span class="pill">${ex.muscle}</span></div><p class="small">${ex.sets} series × ${ex.reps} repeticiones · RIR ${ex.rir} · descanso ${ex.rest}s · ${ex.equipment}</p><p class="small">Técnica: ${escapeHTML(ex.tech)}</p><p class="small">${escapeHTML(movementCue(d.intensity))}</p><button type="button" class="secondary rest-shortcut" data-rest="${ex.rest}">Descanso recomendado: ${ex.rest} segundos · Abrir cronómetro</button><div class="set"><span>#</span><small>Kg</small><small>Reps</small><small>RIR</small><small>Guardar</small></div>${Array.from({length:ex.sets},(_,j)=>{const existing=db.sets.find(s=>s.userId===u.id&&s.date===now()&&s.workoutKey===w.key&&s.exerciseId===ex.id&&s.number===j+1);return `<div class="set" data-set="${j+1}" data-exercise="${escapeHTML(ex.id)}" data-name="${escapeHTML(ex.name)}"><span>${j+1}</span><input data-kg type="number" min="0" max="2500" step="0.5" aria-label="Peso en kg" value="${existing?.kg??''}"><input data-reps type="number" min="1" max="200" aria-label="Repeticiones" value="${existing?.reps??''}"><input data-rir type="number" min="0" max="10" aria-label="RIR" value="${existing?.rir??''}"><button data-save-generated>${existing?'Editar':'Guardar'}</button></div>`}).join('')}</div>`).join('')}<div class="panel"><h2>Finalizar entrenamiento</h2><p id="finishProgress" class="small">${completionProgress(u,w).saved} de ${completionProgress(u,w).required} series registradas.</p><button id="finishWorkout" ${completionProgress(u,w).saved!==completionProgress(u,w).required||completionProgress(u,w).finished?'disabled':''}>${completionProgress(u,w).finished?'Sesión finalizada':'FIN · Terminar sesión'}</button><p class="helper">Guarda todas las series y pulsa FIN para registrar el día. La misma fecha cuenta solo una vez para tu racha.</p></div>`}
function history(){const list=db.sets.filter(x=>x.userId===user().id).sort((a,b)=>b.date.localeCompare(a.date));return `<h1>Historial de entrenamiento</h1><div class="panel tablewrap"><table><thead><tr><th>Fecha</th><th>Ejercicio</th><th>Serie</th><th>Kg</th><th>Reps</th><th>RIR</th></tr></thead><tbody>${list.map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.exerciseName||DAYS[s.day]?.ex[s.exercise]?.[0]||'—')}</td><td>${s.number}</td><td>${s.kg}</td><td>${s.reps}</td><td>${s.rir}</td></tr>`).join('')||'<tr><td colspan="6">Sin registros</td></tr>'}</tbody></table></div>`}


let restElapsedMs=0,restStartedAt=0,restRunning=false,restSuggestedSeconds=90,restInterval=null;
function restElapsed(){return restElapsedMs+(restRunning?Math.max(0,Date.now()-restStartedAt):0)}
function restPaint(){const seconds=Math.floor(restElapsed()/1000);const display=$('#restDisplay'),badge=$('#restBadge'),caption=$('#restCaption'),play=$('#restPlay'),bubble=$('#restBubble');if(display)display.textContent=seconds+' s';if(badge)badge.textContent=seconds+' s';if(caption)caption.textContent='Descanso sugerido: '+restSuggestedSeconds+' segundos'+(seconds>=restSuggestedSeconds?' · Objetivo alcanzado':'');if(play)play.textContent=restRunning?'Pausar':'Iniciar';if(bubble)bubble.classList.toggle('rest-done',seconds>=restSuggestedSeconds)}
function restShow(){const bubble=$('#restBubble');bubble.hidden=false;$('#restLauncher').hidden=true;restPaint()}
function restPause(){if(restRunning){restElapsedMs=restElapsed();restStartedAt=0;restRunning=false}restPaint()}
function restPlay(){if(restRunning){restPause();return}restStartedAt=Date.now();restRunning=true;restPaint()}
function restStart(seconds){if(!Number.isFinite(seconds)||seconds<1||seconds>3600)return;restSuggestedSeconds=seconds;restElapsedMs=0;restStartedAt=Date.now();restRunning=true;restShow()}
function restStop(){restPause();restElapsedMs=0;restPaint()}
function restZero(){restElapsedMs=0;if(restRunning)restStartedAt=Date.now();restPaint()}
function restSetup(){
 $('#restLauncher').onclick=restShow;
 $('#restMin').onclick=()=>{$('#restBubble').hidden=true;$('#restLauncher').hidden=false;restPaint()};
 $('#restPlay').onclick=restPlay;$('#restStop').onclick=restStop;$('#restReset').onclick=restZero;
 document.querySelectorAll('[data-seconds]').forEach(btn=>btn.onclick=()=>{restSuggestedSeconds=Number(btn.dataset.seconds);restPaint()});
 const drag=$('#restDrag'),bubble=$('#restBubble');let initial=null;
 drag.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;const rect=bubble.getBoundingClientRect();initial={x:ev.clientX,y:ev.clientY,left:rect.left,top:rect.top};drag.setPointerCapture(ev.pointerId)});
 drag.addEventListener('pointermove',ev=>{if(!initial)return;const left=Math.min(Math.max(0,initial.left+ev.clientX-initial.x),Math.max(0,innerWidth-bubble.offsetWidth));const top=Math.min(Math.max(0,initial.top+ev.clientY-initial.y),Math.max(0,innerHeight-bubble.offsetHeight));bubble.style.left=left+'px';bubble.style.top=top+'px';bubble.style.right='auto';bubble.style.bottom='auto'});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])drag.addEventListener(event,()=>initial=null);

}
restSetup();
