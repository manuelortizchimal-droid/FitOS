<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>FitOS · Prueba funcional</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color-scheme:dark;background:#0b111b;color:#ecf5fc;--a:#65e3be;--bg:#0b111b;--panel:#172334;--line:#314255;--muted:#9db3c5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:var(--a);color:#06271d;font-weight:750}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#2a3e50;color:#e9f2f9}.danger{background:#61313c;color:#ffdae1}input,textarea,select{background:#0e1927;color:#e9f4fc;border:1px solid #466076;border-radius:9px;padding:11px;max-width:100%;width:100%;min-height:43px}textarea{min-height:73px}label{font-size:12px;color:#adbfce;display:block;margin:12px 0 5px}h1,h2,h3{letter-spacing:-.5px}h1{font-size:30px;margin:0}h2{font-size:21px;margin:0 0 13px}h3{font-size:15px;margin:0 0 9px}p{color:#adc0d0;line-height:1.5}.small,small{font-size:12px;color:#9eb3c5}.brand{font-size:23px;font-weight:850}.brand b{color:var(--a)}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin:12px 0}.shell{max-width:1100px;margin:auto;padding:24px 16px 98px}.auth{max-width:460px;margin:9vh auto}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#101c2a;border:1px solid #33485c;border-radius:13px;padding:15px}.stat strong{display:block;font-size:26px;color:var(--a);margin:5px 0}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:0;background:#0b111bf0;z-index:4}.tabs button{white-space:nowrap;background:#223447;color:#c6d4df}.tabs button.active{background:var(--a);color:#08251c}.pill{font-size:11px;background:#24453f;color:#a1f7d9;padding:6px 9px;border-radius:16px}.notice{padding:12px;border-left:3px solid #e9bf78;background:#2d2c2b;border-radius:7px;font-size:12px;color:#f2dfbe}.hidden{display:none!important}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.exercise{padding:15px;border:1px solid #344a61;background:#111f2e;border-radius:13px;margin:11px 0}.exercise-head{display:flex;justify-content:space-between;align-items:start;gap:9px}.set{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr)) 76px;gap:7px;align-items:end;margin:9px 0}.set span{text-align:center;padding-bottom:11px;color:var(--a)}.set label{margin:0}.set button{padding:11px 4px;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #35485b;padding:12px;text-align:left}th{color:var(--muted);font-size:12px}.status{min-height:21px;font-size:13px;color:var(--a);margin:8px 0}.switch{display:flex;gap:10px}.switch button{flex:1}.footer{padding:10px 0;font-size:11px;color:#91a6b8}.clock{font-size:32px;color:var(--a);font-weight:800}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:12px}.sr{position:absolute;left:-9999px}.banner{padding:9px 16px;text-align:center;font-size:12px;background:#523d23;color:#ffe2b7}@media(max-width:500px){.shell{padding:15px 10px 90px}.panel{padding:14px}.set{grid-template-columns:24px repeat(3,minmax(0,1fr)) 53px;gap:4px}.set button{font-size:10px;padding:10px 2px}.set input{padding:7px 3px;min-width:0}.set label{font-size:10px}}
</style></head><body><div class="banner">DEMO PÚBLICA · Cuentas ficticias locales. No uses contraseñas habituales ni datos personales: no hay servidor ni permisos reales.</div><main id="root" class="shell"></main><script>
'use strict';
const STORE='fitos_demo_v05_public';
async function demoHash(email,password){const data=new TextEncoder().encode('FitOS-demo-only:'+email+':'+password);const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
const DAYS=[{name:'Pierna A · Cuádriceps',ex:[['Hack squat',3,'8–12',180,2],['Prensa 45°',3,'10–15',150,2],['Extensión de cuádriceps',3,'12–15',90,1],['Pantorrilla sentado',4,'10–15',75,2]]},{name:'Push A · Pecho y hombros',ex:[['Press inclinado máquina',3,'6–10',150,2],['Press pecho máquina',3,'8–12',120,2],['Elevación lateral',4,'12–20',75,2]]},{name:'Pull A · Espalda',ex:[['Jalón neutro',3,'8–12',120,2],['Remo pecho apoyado',3,'8–12',120,2],['Curl bíceps',3,'10–15',90,2]]},{name:'Pierna B · Femoral y glúteo',ex:[['Curl femoral sentado',4,'8–12',120,2],['Hip thrust máquina',3,'8–12',150,2],['Abducción máquina',3,'12–20',75,2]]},{name:'Torso B · Hombros',ex:[['Press hombro máquina',3,'8–12',120,2],['Elevación lateral',3,'12–20',75,2],['Curl predicador',3,'10–15',90,2]]},{name:'Pierna C · Completa',ex:[['Smith a caja',3,'8–12',150,2],['Prensa unilateral',2,'10–12',120,2],['Curl femoral sentado',3,'10–15',90,2]]}];
const $=s=>document.querySelector(s), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const month=()=>now().slice(0,7);
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const base=()=>({version:4,branches:[{id:'b1',name:'Sucursal Norte'},{id:'b2',name:'Sucursal Centro'},{id:'b3',name:'Sucursal Sur'}],users:[],memberships:[],sets:[],measures:[],session:null,fee:20,closures:[]});
let db;try{db=JSON.parse(localStorage.getItem(STORE))||base();if(db.version!==4||!Array.isArray(db.users))throw Error('version')}catch{db=base()};let page='home',selectedDay=0,timerStart=0,timerSeconds=0,timerInterval=null;
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch{return false}}
function user(){return db.users.find(u=>u.id===db.session)||null}function membership(u){return db.memberships.find(m=>m.userId===u.id)}function valid(m,at=now()){return !!m&&m.status==='active'&&m.start<=at&&m.end>=at}
function flash(m){const x=$('#status');if(x)x.textContent=m}function layout(content){$('#root').innerHTML=content}const headline=()=>`<div class="row"><div class="brand">Fit<b>OS</b></div><span class="pill">${escapeHTML(user()?.role==='owner'?'Administrador general':'Deportista')}</span></div>`;
function login(){layout(`<div class="auth"><div class="brand">Fit<b>OS</b></div><h1>Bienvenido</h1><p>Prueba las funciones como deportista o dueño del gimnasio.</p><div class="panel"><div class="switch"><button id="loginTab">Iniciar sesión</button><button class="secondary" id="signupTab">Crear cuenta</button></div><form id="access"><label>Correo electrónico</label><input name="email" type="email" required autocomplete="username"><label>Contraseña</label><input name="password" type="password" minlength="8" required autocomplete="current-password"><div id="newFields" class="hidden"><label>Nombre</label><input name="name" maxlength="100"><label>Sucursal</label><select name="branch">${db.branches.map(b=>`<option value="${b.id}">${escapeHTML(b.name)}</option>`).join('')}</select><label>Tipo de cuenta de prueba</label><select name="role"><option value="athlete">Deportista</option><option value="owner">Dueño del gimnasio</option></select><div class="notice">En producción, el rol de dueño únicamente podrá asignarlo un administrador autorizado. Aquí está habilitado para evaluar ambos recorridos.</div></div><button id="accessSubmit" style="width:100%">Entrar</button><p class="status" id="status" role="status"></p></form></div><p class="small">Demo pública sin autenticación real. Usa correo inventado y contraseña exclusiva de prueba. Los datos quedan en este navegador.</p></div>`);let signup=false;const toggle=x=>{signup=x;$('#newFields').classList.toggle('hidden',!signup);$('#accessSubmit').textContent=signup?'Crear cuenta':'Entrar';$('#loginTab').className=signup?'secondary':'';$('#signupTab').className=signup?'':'secondary';$('#access').elements.name.required=signup};$('#signupTab').onclick=()=>toggle(true);$('#loginTab').onclick=()=>toggle(false);$('#access').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),password=f.get('password');if(signup){if(db.users.some(u=>u.email===email))return flash('Este correo ya existe.');if(password.length<8)return flash('La contraseña debe tener 8 caracteres o más.');const u={id:uid(),email,name:f.get('name').trim(),role:f.get('role'),branch:f.get('branch'),passwordHash:await demoHash(email,password),created:now(),goal:'',height:'',weight:'',waist:''};if(!u.name)return flash('Escribe tu nombre.');db.users.push(u);db.memberships.push({id:uid(),userId:u.id,branch:u.branch,start:now(),end:`${Number(now().slice(0,4))+1}-${now().slice(5)}`,status:'active'});db.session=u.id;if(!persist()){db.users.pop();db.memberships.pop();db.session=null;return flash('No se pudieron guardar los datos en este navegador.')}page='home';return render()}const passwordHash=await demoHash(email,password);const u=db.users.find(u=>u.email===email&&u.passwordHash===passwordHash);if(!u)return flash('Credenciales incorrectas.');db.session=u.id;if(!persist())return flash('No se pudo guardar la sesión.');page='home';render()};}
function nav(){let u=user();let tabs=u.role==='owner'?[['home','Resumen'],['members','Miembros'],['billing','Facturación'],['profile','Mi perfil']]:[['home','Inicio'],['training','Entrenar'],['measures','Mediciones'],['history','Historial'],['profile','Mi perfil']];return `<div class="tabs">${tabs.map(([k,n])=>`<button data-page="${k}" class="${page===k?'active':''}">${n}</button>`).join('')}</div>`}
function render(){const u=user();if(!u)return login();let content='';if(u.role==='owner'){if(!['home','members','billing','profile'].includes(page))page='home';content=({home:ownerHome,members:members,billing:billing,profile:profile})[page]()}else{if(!['home','training','measures','history','profile'].includes(page))page='home';content=({home:athleteHome,training:training,measures:measures,history:history,profile:profile})[page]()}layout(`${headline()}${nav()}<p class="status" id="status" role="status"></p>${content}<div class="footer">FitOS QA v0.4 · Prueba local, no producción · <button class="secondary" id="logout">Cerrar sesión</button></div>`);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#logout').onclick=()=>{db.session=null;persist();login()};wire()}
function athleteHome(){const u=user(),m=membership(u),set=db.sets.filter(s=>s.userId===u.id),latest=db.measures.filter(x=>x.userId===u.id).sort((a,b)=>b.date.localeCompare(a.date))[0];return `<h1>Hola, ${escapeHTML(u.name)}</h1><p>Tu espacio de entrenamiento y seguimiento corporal.</p><div class="grid"><div class="stat">Membresía<strong>${valid(m)?'Vigente':'No vigente'}</strong><small>${escapeHTML(db.branches.find(b=>b.id===u.branch)?.name)}</small></div><div class="stat">Series registradas<strong>${set.length}</strong></div><div class="stat">Último peso<strong>${latest?.weight?escapeHTML(latest.weight)+' kg':'—'}</strong></div></div><div class="panel"><h2>Entrenamiento</h2><p>Registra peso, repeticiones y RIR. Tus series guardadas pueden corregirse.</p><button data-go="training">Abrir mi rutina</button></div>`}
function training(){const u=user(),d=DAYS[selectedDay];return `<h1>Entrenamiento</h1><p>Selecciona un día y registra tus series.</p><div class="panel"><label>Día de entrenamiento</label><select id="day">${DAYS.map((x,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>Día ${i+1} · ${escapeHTML(x.name)}</option>`).join('')}</select><div class="row"><h3 style="margin:15px 0 4px">Cronómetro de descanso</h3><div class="clock" id="clock">${timerSeconds} s</div></div><div class="tools"><button id="timerToggle">${timerStart?'Pausar':'Iniciar'}</button><button class="secondary" id="timerReset">Reiniciar</button></div></div>${d.ex.map((ex,i)=>`<div class="exercise"><div class="exercise-head"><h3>${escapeHTML(ex[0])}</h3><span class="pill">${ex[1]} series</span></div><p class="small">${ex[2]} reps · ${ex[3]} s descanso · RIR objetivo ${ex[4]}</p><div class="set"><span>#</span><small>Kg</small><small>Reps</small><small>RIR</small><small>Guardar</small></div>${Array.from({length:ex[1]},(_,j)=>{const existing=db.sets.find(s=>s.userId===u.id&&s.day===selectedDay&&s.exercise===i&&s.number===j+1&&s.date===now());return `<div class="set" data-ex="${i}" data-set="${j+1}"><span>${j+1}</span><input aria-label="Kg" type="number" min="0" max="2500" step="0.5" data-kg value="${existing?.kg??''}"><input aria-label="Reps" type="number" min="1" max="200" step="1" data-reps value="${existing?.reps??''}"><input aria-label="RIR" type="number" min="0" max="10" step="1" data-rir value="${existing?.rir??''}"><button data-save-set>${existing?'Editar':'Guardar'}</button></div>`}).join('')}</div>`).join('')}`}
function measures(){const u=user(),list=db.measures.filter(x=>x.userId===u.id).sort((a,b)=>b.date.localeCompare(a.date));return `<h1>Mediciones</h1><div class="panel"><form id="measureForm"><div class="fields"><div><label>Fecha</label><input name="date" type="date" value="${now()}" required></div><div><label>Peso (kg)</label><input name="weight" type="number" min="20" max="400" step="0.01" required></div><div><label>Cintura (cm)</label><input name="waist" type="number" min="20" max="300" step="0.01"></div><div><label>Grasa corporal (%) estimada</label><input name="fat" type="number" min="1" max="75" step="0.1"></div></div><button>Guardar medición</button></form></div><div class="panel"><h2>Historial corporal</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Peso</th><th>Cintura</th><th>Grasa estimada</th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.date}</td><td>${x.weight} kg</td><td>${x.waist||'—'}</td><td>${x.fat||'—'}</td></tr>`).join('')||'<tr><td colspan="4">Sin mediciones</td></tr>'}</tbody></table></div></div>`}
function history(){const list=db.sets.filter(x=>x.userId===user().id).sort((a,b)=>b.date.localeCompare(a.date));return `<h1>Historial de entrenamiento</h1><div class="panel tablewrap"><table><thead><tr><th>Fecha</th><th>Ejercicio</th><th>Serie</th><th>Kg</th><th>Reps</th><th>RIR</th></tr></thead><tbody>${list.map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(DAYS[s.day]?.ex[s.exercise]?.[0]||'—')}</td><td>${s.number}</td><td>${s.kg}</td><td>${s.reps}</td><td>${s.rir}</td></tr>`).join('')||'<tr><td colspan="6">Sin registros</td></tr>'}</tbody></table></div>`}
function profile(){const u=user();return `<h1>Mi perfil</h1><div class="panel"><form id="profileForm"><label>Nombre</label><input name="name" maxlength="100" value="${escapeHTML(u.name)}" required><label>Estatura (cm)</label><input name="height" type="number" min="50" max="260" step="0.1" value="${escapeHTML(u.height)}"><label>Objetivo</label><textarea name="goal" maxlength="500">${escapeHTML(u.goal)}</textarea><label>Correo</label><input disabled value="${escapeHTML(u.email)}"><button>Guardar perfil</button></form></div>`}
function billableUsers(at){const users=new Set(db.memberships.filter(m=>valid(m,at)).map(m=>m.userId));return [...users].map(id=>db.users.find(u=>u.id===id)).filter(u=>u&&u.role==='athlete')}
function ownerHome(){const u=user(),members=db.users.filter(x=>x.role==='athlete'),active=billableUsers(now()),mau=new Set(db.sets.filter(s=>s.date.slice(0,7)===month()).map(s=>s.userId)).size;return `<h1>Panel del propietario</h1><p>Vista consolidada de las tres sucursales.</p><div class="grid"><div class="stat">Deportistas registrados<strong>${members.length}</strong></div><div class="stat">Membresías vigentes<strong>${active.length}</strong></div><div class="stat">Deportistas que entrenaron este mes<strong>${mau}</strong></div><div class="stat">Importe estimado<strong>$${(active.length*db.fee).toLocaleString('es-MX')}</strong>MXN</div></div><div class="panel"><h2>Distribución por sucursal</h2><div class="tablewrap"><table><thead><tr><th>Sucursal</th><th>Miembros</th><th>Vigentes</th></tr></thead><tbody>${db.branches.map(b=>`<tr><td>${escapeHTML(b.name)}</td><td>${members.filter(u=>u.branch===b.id).length}</td><td>${active.filter(u=>u.branch===b.id).length}</td></tr>`).join('')}</tbody></table></div></div><div class="notice">El cobro se basa en membresías vigentes verificadas, no en inicios de sesión. En esta demo la vigencia se registra manualmente.</div>`}
function members(){const list=db.users.filter(u=>u.role==='athlete');return `<h1>Miembros y membresías</h1><div class="panel"><p class="small">Las cuentas se crean desde el registro público de esta demo. Aquí el propietario controla la vigencia de cada membresía.</p><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Sucursal</th><th>Estado</th><th>Vence</th><th>Acción</th></tr></thead><tbody>${list.map(u=>{const m=membership(u);return `<tr><td>${escapeHTML(u.name)}</td><td>${escapeHTML(db.branches.find(b=>b.id===u.branch)?.name)}</td><td>${valid(m)?'Vigente':'Inactiva'}</td><td><input data-end="${u.id}" type="date" value="${m?.end||now()}"></td><td><button class="secondary" data-member="${u.id}">${m?.status==='active'?'Suspender':'Activar'}</button></td></tr>`}).join('')||'<tr><td colspan="5">Sin deportistas. Crea uno desde registro.</td></tr>'}</tbody></table></div></div>`}
function billing(){const active=billableUsers(now()),cl=db.closures.slice().reverse();return `<h1>Facturación mensual</h1><div class="panel"><h3>Tarifa comercial</h3><label>Comisión por miembro con membresía vigente (MXN)</label><div class="row"><input id="fee" type="number" min="0" max="100000" step="0.01" style="max-width:180px" value="${db.fee}"><button id="feeSave">Guardar tarifa</button></div><p>Periodo actual: ${month()} · ${active.length} membresías facturables · <b>$${(active.length*db.fee).toFixed(2)} MXN</b></p><button id="closeBill">Generar corte demostrativo del mes</button><p class="small">El corte usa la fecha actual y conserva una copia de usuarios y montos. No emite factura fiscal.</p></div><div class="panel"><h2>Cortes guardados</h2><div class="tablewrap"><table><thead><tr><th>Periodo</th><th>Miembros</th><th>Tarifa</th><th>Total</th><th>Acción</th></tr></thead><tbody>${cl.map(x=>`<tr><td>${x.month}</td><td>${x.count}</td><td>$${x.fee}</td><td>$${x.total.toFixed(2)}</td><td><button class="secondary" data-export="${x.id}">CSV</button></td></tr>`).join('')||'<tr><td colspan="5">Sin cortes registrados</td></tr>'}</tbody></table></div></div>`}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});if($('#day'))$('#day').onchange=e=>{selectedDay=Number(e.target.value);render()};document.querySelectorAll('[data-save-set]').forEach(b=>b.onclick=()=>{const r=b.closest('.set'),kg=Number(r.querySelector('[data-kg]').value),reps=Number(r.querySelector('[data-reps]').value),rir=Number(r.querySelector('[data-rir]').value);if(!r.querySelector('[data-kg]').value||!r.querySelector('[data-reps]').value||!r.querySelector('[data-rir]').value||kg<0||kg>2500||!Number.isInteger(reps)||reps<1||reps>200||!Number.isInteger(rir)||rir<0||rir>10)return flash('Revisa kg, repeticiones y RIR.');const key={userId:user().id,date:now(),day:selectedDay,exercise:Number(r.dataset.ex),number:Number(r.dataset.set)},existing=db.sets.find(s=>Object.keys(key).every(k=>s[k]===key[k]));const prev=existing?{...existing}:null;if(existing)Object.assign(existing,{kg,reps,rir});else db.sets.push({...key,kg,reps,rir});if(!persist()){if(existing)Object.assign(existing,prev);else db.sets.pop();return flash('Error de almacenamiento: no se guardó la serie.')}flash('Serie guardada.');b.textContent='Editar'});if($('#timerToggle')){const paint=()=>{const c=$('#clock');if(c)c.textContent=`${timerStart?timerSeconds+Math.floor((Date.now()-timerStart)/1000):timerSeconds} s`};$('#timerToggle').onclick=()=>{if(timerStart){timerSeconds+=Math.floor((Date.now()-timerStart)/1000);timerStart=0}else timerStart=Date.now();$('#timerToggle').textContent=timerStart?'Pausar':'Iniciar';paint()};$('#timerReset').onclick=()=>{timerStart=0;timerSeconds=0;$('#timerToggle').textContent='Iniciar';paint()};if(!timerInterval)timerInterval=setInterval(paint,700)}if($('#measureForm'))$('#measureForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={id:uid(),userId:user().id,date:f.get('date'),weight:Number(f.get('weight')),waist:f.get('waist')?Number(f.get('waist')):null,fat:f.get('fat')?Number(f.get('fat')):null};if(!Number.isFinite(v.weight)||v.weight<20||v.weight>400)return flash('Peso inválido');const existing=db.measures.find(x=>x.userId===v.userId&&x.date===v.date);if(existing)Object.assign(existing,v,{id:existing.id});else db.measures.push(v);if(!persist())return flash('Error de guardado');render();flash('Medición guardada')};if($('#profileForm'))$('#profileForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),u=user();u.name=f.get('name').trim();u.height=f.get('height');u.goal=f.get('goal').trim();if(!u.name)return flash('El nombre es obligatorio');if(!persist())return flash('No pudo guardarse');render();flash('Perfil actualizado')};document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{const m=membership({id:b.dataset.member});if(!m)return;m.status=m.status==='active'?'suspended':'active';const date=$(`[data-end="${b.dataset.member}"]`);m.end=date?.value||m.end;if(!persist())return flash('No pudo guardarse');render();flash('Membresía actualizada')});if($('#feeSave'))$('#feeSave').onclick=()=>{const n=Number($('#fee').value);if(!Number.isFinite(n)||n<0||n>100000)return flash('Tarifa inválida');db.fee=n;if(!persist())return flash('No pudo guardarse');render();flash('Tarifa guardada')};if($('#closeBill'))$('#closeBill').onclick=()=>{const m=month();if(db.closures.some(c=>c.month===m))return flash('Ya existe un corte para este mes.');const people=billableUsers(now());db.closures.push({id:uid(),month:m,date:now(),fee:db.fee,count:people.length,total:Math.round(people.length*db.fee*100)/100,lines:people.map(u=>({name:u.name,email:u.email,branch:db.branches.find(b=>b.id===u.branch)?.name,amount:db.fee}))});if(!persist())return flash('No pudo guardarse');render();flash('Corte guardado')};document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const c=db.closures.find(x=>x.id===b.dataset.export);if(!c)return;const csv=[['Nombre','Correo','Sucursal','Monto MXN'],...c.lines.map(l=>[l.name,l.email,l.branch,l.amount])].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`fitos-corte-${c.month}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})}
if(!persist())console.warn('FitOS demo: browser storage unavailable');render();
</script></body></html>
