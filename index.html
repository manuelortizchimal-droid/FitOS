function dayOrdinal(day){const [y,m,d]=day.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)}
function streakFor(userId,reference=now()){const days=[...new Set(db.completedWorkouts.filter(x=>x.userId===userId).map(x=>x.date))].sort().reverse();if(!days.length)return 0;let last=dayOrdinal(days[0]),today=dayOrdinal(reference);if(last>today||today-last>1)return 0;let count=0;for(const date of days){const n=dayOrdinal(date);if(n===last){count++;last--}else if(n<last)break}return count}
function completionProgress(u,w,date=now()){const required=w.session.ex.reduce((a,ex)=>a+ex.sets,0);const saved=w.session.ex.reduce((a,ex)=>a+Array.from({length:ex.sets},(_,j)=>db.sets.some(row=>row.userId===u.id&&row.date===date&&row.workoutKey===w.key&&row.exerciseId===ex.id&&row.number===j+1)).filter(Boolean).length,0);const finished=db.completedWorkouts.some(row=>row.userId===u.id&&row.date===date&&row.workoutKey===w.key);return {required,saved,finished}}

function todayPlanIndex(plan,date=now()){
 if(!plan||!Array.isArray(plan.sessions)||!plan.sessions.length||date<plan.start||date>plan.end)return -1;
 const offset=dayOrdinal(date)-dayOrdinal(plan.start);
 const weekday=((offset%7)+7)%7;
 return weekday<plan.sessions.length?weekday:-1;
}

function routineFromCriteria(c,dayIndex=0){
 const strength=c.objective==='strength',endurance=c.objective==='endurance';
 const rest=strength?120:c.intensity==='high'?90:c.intensity==='moderate'?75:60;
 let sets=c.wholeBody?(c.minutes<=30?1:c.intensity==='high'&&c.minutes>=75?3:2):(c.minutes<=20 && c.muscles.length>=3)?1:c.intensity==='high'?3:2;
 const reps=c.wholeBody&&c.minutes<=30?'8–10':strength?'6–10':endurance?'12–20':['hypertrophy','recomposition'].includes(c.objective)?'8–12':'10–15';
 const rir=c.intensity==='light'?4:c.intensity==='moderate'?3:2;
 const warmup=Math.min(7,Math.max(4,Math.round(c.minutes*.12)));let remaining=c.minutes-warmup;
 const muscles=c.wholeBody?[...c.muscles]:c.duration==='today'||c.frequency===1?[...c.muscles]:c.frequency<=c.muscles.length?c.muscles.filter((_,i)=>i%c.frequency===dayIndex):[c.muscles[dayIndex%c.muscles.length]];const available=[];
 while(sets>1 && Math.ceil((sets*Number(reps.split('–').at(-1))*(c.intensity==='high'?6:4)+(sets-1)*rest+(c.wholeBody?25:50))/60)*muscles.length>remaining)sets--;
 for(let pass=0;pass<(c.wholeBody?1:4);pass++){let added=false;for(const m of muscles){
  const items=EXERCISE_BANK[m],ex=items[(pass+dayIndex)%items.length];
  if(available.some(x=>x.id===m+':'+ex[0]))continue;
  const topReps=Number(reps.split('–').at(-1));const repetitionSeconds=c.intensity==='high'?6:4;const cost=Math.ceil((sets*topReps*repetitionSeconds+(sets-1)*rest+(c.wholeBody?25:50))/60);
  if(cost>remaining)continue;
  remaining-=cost;added=true;
  available.push({id:m+':'+ex[0],muscle:m,name:ex[0],sets,reps,rir,rest,tech:ex[1],equipment:ex[2],minutes:cost});
 }if(!added)break}
 if(!available.length)throw Error('El tiempo es insuficiente para esta selección. Prueba con más minutos.');
 return {title:c.wholeBody?'Cuerpo completo':muscles.join(' + '),objective:c.objective,level:'guided',intensity:c.intensity,minutes:c.minutes,estimatedMinutes:c.minutes-remaining,ex:available};
}
function readCriteria(form){const f=new FormData(form),wholeBody=f.get('wholeBody')==='yes',ids=wholeBody?MUSCLES.map((_,i)=>i):f.getAll('muscle').map(Number);
 if(ids.length<1||(!wholeBody&&ids.length>3)||ids.some(x=>!Number.isInteger(x)||x<0||x>=MUSCLES.length)||new Set(ids).size!==ids.length)throw Error('Elige entre uno y tres grupos musculares.');
 const minutes=Number(f.get('minutes'));const duration=String(f.get('duration'));const frequency=duration==='today'?1:Number(f.get('frequency'));if(![20,30,40,45,60,75,90].includes(minutes)||!Number.isInteger(frequency)||frequency<1||frequency>7)throw Error('Revisa los minutos o cuántas veces entrenarás por semana.');
 const intensity=String(f.get('intensity')),objective=String(f.get('objective'));
 if(!['light','moderate','high'].includes(intensity)||!['general','tone','hypertrophy','fatloss','recomposition','strength','endurance'].includes(objective)||!['today','week','fortnight','month'].includes(duration))throw Error('Revisa la configuración de tu rutina.');
 const days=duration==='today'?1:duration==='week'?7:duration==='fortnight'?14:30;if(!Number.isInteger(days)||days<1||days>90)throw Error('La duración debe ser de 1 a 90 días.');
 const startDate=duration==='today'?now():String(f.get('startDate'));if(!/^\d{4}-\d{2}-\d{2}$/.test(startDate)||dayOrdinal(startDate)<dayOrdinal(now())||dayOrdinal(startDate)>dayOrdinal(now())+365)throw Error('Elige una fecha de inicio desde hoy y dentro del próximo año.');return {muscles:ids.map(i=>MUSCLES[i]),wholeBody,minutes,frequency,level:'guided',intensity,objective,duration,days,startDate};
}

function training(){const u=user(),w=ownWorkout();if(!w)return `<h1>Rutina</h1><div class="panel"><h2>Prepara tu primer entrenamiento</h2><p>Elige qué quieres entrenar y cuánto tiempo tienes. FitOS preparará tu rutina.</p><button data-go="generator">Crear mi rutina</button></div>`;
